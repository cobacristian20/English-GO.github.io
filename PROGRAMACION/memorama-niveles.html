<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selecciona Nivel - Memorama</title>
  <link rel="shortcut icon" href="img/logo_r.png" type="image/x-icon">
  <style>
    body {
      background: linear-gradient(to right, #f5e6d3, #e7d8c9);
      font-family: 'Comic Sans MS', sans-serif;
      color: #4b3f2f;
      padding: 40px;
      text-align: center;
      padding-top: 120px;
    }

    .encabezado {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #f4c98b;
      display: flex;
      align-items: center;
      justify-content: start;
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin-right: 15px;
      border-radius: 50%;
    }

    h1 {
      color: #a77b5a;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .nivel-grid {
      display: grid;
      gap: 2rem;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      max-width: 900px;
      margin: auto;
    }

    .card {
      background-color: #fdf6ee;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
      background-color: #ffe8d2;
    }

    .card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #4b3621;
    }

    .card p {
      font-size: 1rem;
      margin: 0;
      color: #4b3621;
    }

    .volver {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background-color: #d7c0ae;
      color: #4b3f2f;
      font-weight: bold;
      border-radius: 15px;
      text-decoration: none;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s, transform 0.2s;
    }

    .volver:hover {
      background-color: #c3a995;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header class="encabezado">
    <img src="img/logo.png" alt="Logo ENGLISH-GO" class="logo" />
    <h1 class="titulo-proyecto">ENGLISH-GO</h1>
  </header>

  <h1>🧠 Elige un nivel para el memorama</h1>

  <div class="nivel-grid">
    <div class="card" onclick="window.location.href='memorama-facil.html'">
      <h2>🌱 Fácil</h2>
      <p>6 pares de cartas, ideal para comenzar y aprender las palabras básicas.</p>
    </div>

    <div class="card" onclick="window.location.href='memorama-normal.html'">
      <h2>🎯 Normal</h2>
      <p>12 pares con más vocabulario. Pon a prueba tu memoria y atención.</p>
    </div>

    <div class="card" onclick="window.location.href='memorama-dificil.html'">
      <h2>🔥 Difícil</h2>
      <p>27 pares con imágenes y palabras. ¡Demuestra lo que sabes!</p>
    </div>
  </div>

  <a href="partes-cuerpo.html" class="volver">⬅ Volver a actividades</a>

</body>
</html>
